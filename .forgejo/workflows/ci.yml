name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Eval all hosts
        run: |
          for host in daredevil devil old-devil homelab-one; do
            echo "=== Eval $host ==="
            nix eval .#nixosConfigurations.$host.config.system.build.toplevel.name \
              --option accept-flake-config true
          done

      - name: Check formatting (alejandra)
        run: |
          nix run nixpkgs#alejandra -- --check .
