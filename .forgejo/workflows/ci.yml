name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host:
          - daredevil
          - devil
          - old-devil
          - homelab-one
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Eval ${{ matrix.host }}
        run: |
          nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.name \
            --option accept-flake-config true

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting (alejandra)
        run: |
          nix run nixpkgs#alejandra -- --check .