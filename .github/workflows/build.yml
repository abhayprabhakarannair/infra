name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main, 2026-09-05

      - name: Use Cachix binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: abhay-infra
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build all hosts
        run: |
          for host in daredevil devil old-devil homelab-one; do
            echo "=== Building $host ==="
            nix build .#nixosConfigurations.$host.config.system.build.toplevel \
              --print-build-logs \
              --no-update-lock-file
          done
