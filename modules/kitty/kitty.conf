hide_window_decorations yes

# Primary font: JetBrains Mono Nerd Font
font_family      JetBrainsMono Nerd Font

# Fallback fonts for scripts not covered by JetBrains Mono
# Noto Sans Malayalam for clean browser-quality Malayalam rendering
symbol_map U+0D00-U+0D7F Noto Sans Malayalam
symbol_map U+A830-U+A83F Noto Sans Malayalam

# Font size
font_size 11.0
